name: Run Biotech Agent Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test — curated diseases (no API key needed)
        run: |
          python - << 'EOF'
          import sys, re
          sys.path.insert(0, '.')
          from biotech_agent.pipeline import run_sync

          tests = [
              ("Alzheimer disease",   "alzheimer",           15),
              ("atopic dermatitis",   "atopic_dermatitis",   10),
              ("pancreatic cancer",   "pancreatic_cancer",   12),
              ("ALS Lou Gehrig",      "als",                 15),
              ("sickle cell disease", "sickle_cell",          9),
          ]

          passed = 0
          for query, expected_match, min_trials in tests:
              r = run_sync(query)
              html = r['html']
              matched = r['retrieval_stats'].get('matched_disease')
              table_html = html[html.find('trial-table'):html.find('trial-table')+20000]
              ncts = set(re.findall(r'NCT\d{8}', table_html))
              sections = len(re.findall(r'section-number[^>]*>\d+<', html))
              charts = html.count("data:image/png;base64,")
              raw_pipes = len(re.findall(r'\|[-]+\|', html))

              ok = (matched == expected_match and len(ncts) >= min_trials
                    and sections >= 12 and charts >= 14 and raw_pipes == 0)
              status = "PASS" if ok else "FAIL"
              print(f"[{status}] {query:<35} match={matched} trials={len(ncts)} sections={sections} charts={charts}")
              if ok:
                  passed += 1
              else:
                  if matched != expected_match: print(f"       match mismatch: got {matched}")
                  if len(ncts) < min_trials:    print(f"       trials: {len(ncts)} < {min_trials}")
                  if sections < 12:             print(f"       sections: {sections} < 12")
                  if charts < 14:               print(f"       charts: {charts} < 14")
                  if raw_pipes > 0:             print(f"       raw pipe chars: {raw_pipes}")

          print(f"\n{passed}/{len(tests)} tests passed")
          if passed < len(tests):
              sys.exit(1)
          EOF

      - name: Upload sample report artifact
        if: success()
        run: |
          python - << 'EOF'
          import sys
          sys.path.insert(0, '.')
          from biotech_agent.pipeline import run_sync
          import os
          os.makedirs('outputs', exist_ok=True)
          r = run_sync('ALS Lou Gehrig disease')
          with open('outputs/als_ci_report.html', 'w') as f:
              f.write(r['html'])
          print(f"Saved CI report: {len(r['html'])//1024}KB")
          EOF

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sample-report
          path: outputs/als_ci_report.html
          retention-days: 7
