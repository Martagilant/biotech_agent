name: Run Biotech Agent Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install langgraph langchain-anthropic langchain-core anthropic aiohttp requests fastapi uvicorn python-multipart jinja2 matplotlib seaborn faiss-cpu

      - name: Run smoke tests
        env:
          MPLBACKEND: Agg
        run: |
          python -c "
          import sys, re, os
          os.environ['MPLBACKEND'] = 'Agg'
          sys.path.insert(0, '.')
          from biotech_agent.pipeline import run_sync
          r = run_sync('Alzheimer disease')
          matched = r['retrieval_stats'].get('matched_disease')
          charts = r['html'].count('data:image/png;base64,')
          print(f'matched={matched} charts={charts}')
          assert matched == 'alzheimer', f'Wrong match: {matched}'
          assert charts >= 14, f'Only {charts} charts'
          print('PASS')
          "
